<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Guardias - Camilleros</title>
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fffdf9;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 14px;
        }

        button:hover {
            background-color: #34495e;
        }

        .btn-back {
            background-color: #2980b9;
        }
        .btn-back:hover {
            background-color: #1f618d;
        }

        .btn-clear-history {
            background-color: #c0392b;
        }
        .btn-clear-history:hover {
            background-color: #a93226;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .history-card {
            background: #ffffff;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .history-card-header {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 8px;
        }

        .history-table th, .history-table td {
            border: 1px solid #d0d0d0;
            padding: 6px 10px;
            text-align: left;
        }

        .history-table th {
            background-color: #f1f2f6;
            color: #333;
        }

        .empty-history {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 30px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Historial de Guardias</h1>
        <div class="header-actions">
            <button class="btn-clear-history" onclick="clearAllHistory()">🗑️ Borrar Historial</button>
            <button class="btn-back" onclick="window.location.href='index.html'">← Volver al Listado Actual</button>
        </div>
    </header>

    <div id="history-container" class="history-list">
        <!-- El historial se cargará dinámicamente aquí -->
    </div>
</div>

<script>
    function loadHistory() {
        const container = document.getElementById('history-container');
        container.innerHTML = '';

        // Buscar todas las claves guardadas en localStorage que correspondan al formato de pacientes de guardia
        let keys = [];
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key.startsWith('guardia_pacientes_')) {
                keys.push(key);
            }
        }

        // Ordenar las fechas de más reciente a más antigua
        keys.sort().reverse();

        if (keys.length === 0) {
            container.innerHTML = '<div class="empty-history">No hay registros guardados en el historial todavía.</div>';
            return;
        }

        keys.forEach(key => {
            let dateStr = key.replace('guardia_pacientes_', '');
            let patientsData = JSON.parse(localStorage.getItem(key)) || [];

            // Formatear la fecha para que se lea de forma amigable
            let [year, month, day] = dateStr.split('-');
            let dateObj = new Date(year, month - 1, day);
            let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let formattedDate = dateObj.toLocaleDateString('es-ES', options);

            let card = document.createElement('div');
            card.className = 'history-card';

            let tableRows = '';
            if (patientsData.length > 0) {
                patientsData.forEach((item, index) => {
                    tableRows += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><b>${item.patient}</b></td>
                            <td>${item.origin || '--'}</td>
                            <td>${item.dest || '--'}</td>
                            <td>${item.bed ? 'Cama ' + item.bed : '--'}</td>
                        </tr>
                    `;
                });
            } else {
                tableRows = `<tr><td colspan="5" style="text-align: center; font-style: italic; color: #7f8c8d;">Lista limpiada o sin pacientes registrados en esta fecha.</td></tr>`;
            }

            card.innerHTML = `
                <div class="history-card-header">
                    <span>📅 ${formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1)}</span>
                </div>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th style="width: 35px;">N°</th>
                            <th>Paciente</th>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th style="width: 90px;">Cama</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            `;

            container.appendChild(card);
        });
    }

    function clearAllHistory() {
        if (confirm('¿Estás seguro de que deseas eliminar todo el historial de guardias guardado? Esta acción no se puede deshacer.')) {
            let keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.startsWith('guardia_pacientes_') || key.startsWith('guardia_turno_') || key === 'guardia_current_date') {
                    keysToRemove.push(key);
                }
            }
            
            keysToRemove.forEach(key => localStorage.removeItem(key));
            loadHistory();
        }
    }

    loadHistory();
    
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrado con éxito', reg))
                .catch(err => console.log('Error al registrar Service Worker', err));
        });
    }
</script>

</body>
</html>
